sentence=Open Sound Control (OSC)
paragraph=Open Sound Control (OSC) is an open, transport-independent, message-based encoding developed for communication among computers, sound synthesizers, and other multimedia devices. NOTE 4.0.0 corrects the on-the-wire encoding of the 'r' (RGBA) and 'm' (MIDI) types, which were byte-reversed before, and sends the OSC 1.0 "immediately" timetag on bundles built without one. Links to devices still running 3.5.8 or earlier must be updated at both ends. See the README.
